<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Mất kết nối — TOÁN AI</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
        main { max-width: 480px; margin: 0 auto; padding: 48px 20px; text-align: center; }
        img { width: 72px; height: 72px; }
        h1 { font-size: 1.35rem; margin: 16px 0 8px; }
        p { color: #64748b; line-height: 1.5; }
        button { background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 1rem; }
        ul { list-style: none; padding: 0; margin: 24px 0 0; text-align: left; }
        li a { display: block; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; color: #0f172a; text-decoration: none; }
        [hidden] { display: none; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>Bạn đang offline</h1>
        <p>Kiểm tra kết nối mạng rồi thử lại. Làm bài, hỏi AI và thanh toán cần có mạng.</p>
        <button type="button" onclick="location.reload()">Thử lại</button>

        <section id="saved" hidden>
            <h2 style="font-size:1rem;margin-top:32px">Bài học đã lưu để đọc offline</h2>
            <ul id="saved-list"></ul>
        </section>
    </main>

    <script>
        // Liệt kê các trang bài học service worker đã lưu (cache "toanai-lessons").
        (async () => {
            if (!('caches' in window)) return;
            const cache = await caches.open('toanai-lessons');
            const requests = await cache.keys();
            if (!requests.length) return;

            const list = document.getElementById('saved-list');
            for (const req of requests.reverse()) {
                const res = await cache.match(req);
                const html = res ? await res.text() : '';
                const title = (html.match(/<title>([^<]*)<\/title>/) || [])[1] || req.url;
                const a = document.createElement('a');
                a.href = req.url;
                a.textContent = title.replace(/\s+—\s+TOÁN AI$/, '');
                const li = document.createElement('li');
                li.appendChild(a);
                list.appendChild(li);
            }
            document.getElementById('saved').hidden = false;
        })();
    </script>
</body>
</html>
