# Nginx cho TOÁN AI. Thay hoctoanonline.com và đường dẫn chứng chỉ cho đúng máy chủ.

server {
    listen 80;
    listen [::]:80;
    server_name hoctoanonline.com www.hoctoanonline.com;
    return 301 https://hoctoanonline.com$request_uri;
}

# https://www. cũng phải chuyển về miền chính: thiếu khối này thì www trả 200 cùng nội dung → Google thấy
# cả site bị nhân đôi. (Chứng chỉ phải có cả www; site đứng sau Cloudflare thì làm Redirect Rule ở đó cũng được.)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hoctoanonline.com;

    ssl_certificate     /etc/letsencrypt/live/hoctoanonline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoctoanonline.com/privkey.pem;

    return 301 https://hoctoanonline.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hoctoanonline.com;

    root /var/www/toan-ai/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/hoctoanonline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoctoanonline.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;   # nhập câu hỏi từ file Excel
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Asset Vite có hash trong tên → cache vĩnh viễn.
    location /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Ảnh người dùng tải lên: tên file ngẫu nhiên, thay ảnh là đổi tên → cache 30 ngày.
    location ~* ^/storage/.+\.(jpe?g|png|webp|gif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Service worker và manifest phải luôn lấy bản mới.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;  # lượt gọi AI đồng bộ có thể mất vài chục giây
    }

    # Chặn file ẩn (.env, .git…).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
