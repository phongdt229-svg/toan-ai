; Supervisor: giữ queue worker TOÁN AI luôn chạy.
; Copy vào /etc/supervisor/conf.d/ rồi: supervisorctl reread && supervisorctl update
[program:toan-ai-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/toan-ai/artisan queue:work redis --sleep=3 --tries=3 --backoff=30 --max-time=3600 --memory=256
directory=/var/www/toan-ai
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Job AI có thể mất ~60s — đợi job đang chạy xong khi restart.
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/toan-ai/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
